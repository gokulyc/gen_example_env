[project]
name = "gen_example_env"
version = "0.2.0"
description = "Generate a .env.example file from an existing .env file, with secret values stripped."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Gokul Y", email = "gokulyc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
]

[project.scripts]
gen_example_env = "gen_example_env.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "gen_example_env._core"
features = ["pyo3/extension-module"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
