[project]
name = "gen_example_env"
version = "0.1.0"
description = "Generate a .env.example file from an existing .env file, with secret values stripped."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Gokul Y", email = "gokulyc@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15",
]

[project.scripts]
gen_example_env = "gen_example_env.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
